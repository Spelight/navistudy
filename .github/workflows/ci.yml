name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm --prefix apps/mt-web ci
      - run: npm run build:mt
      - run: npm --prefix apps/plan/frontend ci
      - run: npm --prefix apps/plan/frontend test -- --run
      - run: npm run build:plan
  passport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
      - run: php apps/study-platform/tests/run.php
